services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: expo_vercel_web

    # Puerto Windows : Puerto del contenedor
    ports:
      - "3000:3000"

    # Variables privadas utilizadas por Next.js en el servidor.
    env_file:
      - .env.local

    # Montar el proyecto para poder editarlo desde Windows
    # y ver los cambios desde el contenedor.
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

    # Ejecutar Next.js escuchando en todas las interfaces
    # para que Windows pueda acceder al puerto 3000.
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  node_modules:
  next_cache: